[project]
name = "policy-intelligence-agent"
version = "0.1.0"
description = "个人政策趋势智能分析助手"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Policy Intelligence Agent"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13",
    "aiosqlite>=0.20.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.6.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "click>=8.0.0",
    "wecom-aibot-python-sdk>=1.0.2",
    "scrapling[all]>=0.5",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "playwright>=1.40.0",
    "tzdata>=2024.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
pia = "app.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
